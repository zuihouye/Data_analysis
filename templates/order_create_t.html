{% extends 'layout_t.html' %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom pt-3 pb-3">
                <h5 class="mb-0 fw-bold text-dark">确认下单</h5>
            </div>
            <div class="card-body">
                {% if products %}
                <form method="post" action="{{ url_for('order.order_create') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="form_token" value="{{ form_token }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">商品</label>
                        <select class="form-select" name="product_id" id="productSelect" required>
                            {% for product in products %}
                            <option value="{{ product.product_id }}"
                                    data-ppu="{{ product.ppu }}"
                                    {% if product.product_id == preselect %}selected{% endif %}>
                                {{ product.product_name }}（{{ product.product_category or '未分类' }}）
                                —— ¥ {{ "%.2f"|format(product.ppu) }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">数量</label>
                        <input type="number" class="form-control" name="quantity" id="quantity"
                               min="1" max="999" value="1" required>
                    </div>
                    <div class="alert alert-light border small mb-4">
                        应付金额：<span class="fw-bold text-danger fs-5" id="previewAmount">—</span>
                        <div class="text-secondary mt-1">
                            下单后请与客服确认线下付款方式；员工确认收款后订单变为「已支付」。
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark px-4">提交订单</button>
                        <a href="{{ url_for('order.product_list') }}" class="btn btn-outline-secondary">返回商品</a>
                    </div>
                </form>
                {% else %}
                <div class="text-center text-secondary py-5">
                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                    暂无可购买商品，请等员工上架后再来。
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    const select = document.getElementById('productSelect');
    const quantity = document.getElementById('quantity');
    const preview = document.getElementById('previewAmount');
    if (!select || !quantity || !preview) return;

    function update() {
        const opt = select.options[select.selectedIndex];
        const ppu = parseFloat(opt && opt.dataset.ppu ? opt.dataset.ppu : '0');
        const qty = parseInt(quantity.value || '0', 10);
        preview.textContent = '¥ ' + (ppu * Math.max(qty, 0)).toFixed(2);
    }
    select.addEventListener('change', update);
    quantity.addEventListener('input', update);
    update();
})();
</script>
{% endblock %}
