<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>客户注册 · xx订单平台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth">
  <div class="auth__top">
    <b>xx订单平台</b><span>客户自助注册</span>
  </div>

  <div class="auth__main">
    <div class="auth__side">
      <h1>注册一个客户账号，<br>开始浏览与下单</h1>
      <p>注册成功后会自动创建一份客户主数据（所在地区用于区域分析），并直接登录进入商品页。</p>
      <ul class="auth__points">
        <li><i></i>手机号即登录账号，密码至少 8 位</li>
        <li><i></i>注册后可浏览在售商品、下单并查看自己的订单</li>
        <li><i></i>订单支付由内部员工线下确认收款后入账</li>
      </ul>
    </div>

    <div class="auth__card">
      <h2>客户注册</h2>
      <p class="sub">带 <span class="req">*</span> 的为必填项</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="formfield">
          <label for="phone">手机号（登录用）<span class="req">*</span></label>
          <input class="input" type="text" id="phone" name="phone"
                 placeholder="请输入 11 位手机号" autocomplete="username"
                 inputmode="numeric" required autofocus>
        </div>
        <div class="formfield">
          <label for="username">昵称<span class="req">*</span></label>
          <input class="input" type="text" id="username" name="username"
                 placeholder="请输入昵称" maxlength="64" required>
        </div>
        <div class="formfield">
          <label for="region">所在地区<span class="req">*</span></label>
          <input class="input" type="text" id="region" name="region"
                 placeholder="例如：Mandalay" required>
        </div>
        <div class="formfield">
          <label for="pwd">密码（至少 8 位）<span class="req">*</span></label>
          <input class="input" type="password" id="pwd" name="pwd"
                 autocomplete="new-password" minlength="8" required>
        </div>
        <div class="formfield">
          <label for="pwd2">确认密码<span class="req">*</span></label>
          <input class="input" type="password" id="pwd2" name="pwd2"
                 autocomplete="new-password" minlength="8" required>
        </div>

        {% if error %}
        <div class="flash flash--error" role="alert">{{ error }}</div>
        {% endif %}

        <button class="btn btn--primary" type="submit">注册并登录</button>
      </form>

      <div class="auth__foot">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></div>
    </div>
  </div>
</body>
</html>
