<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户注册</title>
    <link rel="stylesheet" href="/static/bootstrap-5.3.0-alpha1-dist/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f0f2f5; }
        .reg-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reg-card { width: 480px; border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.10); }
        .reg-card .card-header {
            background: linear-gradient(135deg, #343a40 0%, #495057 100%);
            border-radius: 16px 16px 0 0; padding: 24px 32px 18px;
        }
        .reg-card .card-body { padding: 28px 32px; }
    </style>
</head>
<body>
<div class="reg-wrapper">
    <div class="card reg-card">
        <div class="card-header text-center">
            <h4 class="text-white fw-bold mb-1"><i class="bi bi-person-plus me-2"></i>客户注册</h4>
            <p class="text-white-50 mb-0 small">注册后即可浏览商品并下单</p>
        </div>
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">手机号（登录用）</label>
                    <input type="text" class="form-control" name="phone" placeholder="请输入 11 位手机号"
                           autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">昵称</label>
                    <input type="text" class="form-control" name="username" placeholder="请输入昵称" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">所在地区</label>
                    <input type="text" class="form-control" name="region" placeholder="例如：Mandalay" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">密码（至少 8 位）</label>
                    <input type="password" class="form-control" name="pwd" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">确认密码</label>
                    <input type="password" class="form-control" name="pwd2" autocomplete="new-password" required>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 mb-3 small">
                    <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
                </div>
                {% endif %}

                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                    <i class="bi bi-check2-circle me-1"></i>注册并登录
                </button>
                <div class="text-center mt-3">
                    <span class="text-secondary small">已有账号？</span>
                    <a href="/login" class="small text-decoration-none">去登录</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="/static/jquery-4.0.0.min.js"></script>
<script src="/static/bootstrap-5.3.0-alpha1-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
