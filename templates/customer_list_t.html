{% extends 'layout_t.html' %}

{% block body %}
    <div class="card shadow-sm border-0 rounded-3">

        <div class="card-header bg-white border-bottom pt-3 pb-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-dark">客户列表</h5>
            <div class="d-flex align-items-center gap-2">
                <label class="text-secondary small mb-0">每页：</label>
                <select class="form-select form-select-sm" id="pageSizeSelect" style="width: 80px;">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="dataTable">
                    <thead class="table-light text-secondary">
                        <tr>
                            <th class="ps-4" style="width: 180px;">客户ID</th>
                            <th>所在地区</th>
                            <th style="width: 140px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        {% for customer in datalist %}
                        <tr>
                            <td class="ps-4 text-secondary fw-medium">{{ customer.customer_id }}</td>
                            <td class="fw-semibold text-dark">{{ customer.region }}</td>
                            <td>
                                <a href="/customer/update?customer_id={{ customer.customer_id }}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a href="/customer/delete?customer_id={{ customer.customer_id }}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('确认删除该客户吗?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% else %}
                        <tr id="emptyRow">
                            <td colspan="3" class="text-center text-secondary py-5">
                                <i class="bi bi-people fs-2 d-block mb-2"></i>暂无客户数据
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center px-3 py-2" id="paginationBar">
            <span class="text-secondary small" id="pageInfo"></span>
            <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
        </div>

    </div>

<script>
(function () {
    const rows = Array.from(document.querySelectorAll('#tableBody tr:not(#emptyRow)'));
    const pageInfo = document.getElementById('pageInfo');
    const pagination = document.getElementById('pagination');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const paginationBar = document.getElementById('paginationBar');
    let currentPage = 1;

    function pageSize() { return parseInt(pageSizeSelect.value); }

    function render(page) {
        currentPage = page;
        const size = pageSize();
        const total = rows.length;
        const totalPages = Math.max(1, Math.ceil(total / size));
        currentPage = Math.min(currentPage, totalPages);
        const start = (currentPage - 1) * size;
        const end = start + size;

        rows.forEach((r, i) => r.style.display = (i >= start && i < end) ? '' : 'none');
        pageInfo.textContent = total === 0 ? '' : `第 ${start + 1}–${Math.min(end, total)} 条，共 ${total} 条`;
        paginationBar.style.display = total === 0 ? 'none' : '';

        pagination.innerHTML = '';
        const maxBtn = 7;
        let pages = [];
        if (totalPages <= maxBtn) {
            for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
            pages = [1];
            let lo = Math.max(2, currentPage - 2), hi = Math.min(totalPages - 1, currentPage + 2);
            if (lo > 2) pages.push('...');
            for (let i = lo; i <= hi; i++) pages.push(i);
            if (hi < totalPages - 1) pages.push('...');
            pages.push(totalPages);
        }

        const prevLi = document.createElement('li');
        prevLi.className = 'page-item' + (currentPage === 1 ? ' disabled' : '');
        prevLi.innerHTML = `<a class="page-link" href="#">«</a>`;
        prevLi.querySelector('a').addEventListener('click', e => { e.preventDefault(); if (currentPage > 1) render(currentPage - 1); });
        pagination.appendChild(prevLi);

        pages.forEach(p => {
            const li = document.createElement('li');
            if (p === '...') {
                li.className = 'page-item disabled';
                li.innerHTML = `<span class="page-link">…</span>`;
            } else {
                li.className = 'page-item' + (p === currentPage ? ' active' : '');
                li.innerHTML = `<a class="page-link" href="#">${p}</a>`;
                li.querySelector('a').addEventListener('click', e => { e.preventDefault(); render(p); });
            }
            pagination.appendChild(li);
        });

        const nextLi = document.createElement('li');
        nextLi.className = 'page-item' + (currentPage === totalPages ? ' disabled' : '');
        nextLi.innerHTML = `<a class="page-link" href="#">»</a>`;
        nextLi.querySelector('a').addEventListener('click', e => { e.preventDefault(); if (currentPage < totalPages) render(currentPage + 1); });
        pagination.appendChild(nextLi);
    }

    pageSizeSelect.addEventListener('change', () => render(1));
    render(1);
})();
</script>
{% endblock %}
