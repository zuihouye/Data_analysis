<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <link rel="stylesheet" href="/static/bootstrap-5.3.0-alpha1-dist/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
        }
        .login-card .card-header {
            background: linear-gradient(135deg, #343a40 0%, #495057 100%);
            border-radius: 16px 16px 0 0;
            padding: 28px 32px 20px;
        }
        .login-card .card-body {
            padding: 32px;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-header text-center">
            <h4 class="text-white fw-bold mb-1">
                <i class="bi bi-box-seam me-2"></i>xx订单平台
            </h4>
            <p class="text-white-50 mb-0 small">请登录您的账号</p>
        </div>
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">手机号</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-phone text-secondary"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0"
                               placeholder="请输入手机号" name="mobile" autocomplete="username"/>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">密码</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-secondary"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0"
                               name="pwd" placeholder="请输入密码" autocomplete="current-password">
                    </div>
                </div>
                {% if error %}
                <div class="alert alert-danger py-2 mb-3 small">
                    <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
                </div>
                {% endif %}
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>登录
                </button>
                <div class="text-center mt-3">
                    <span class="text-secondary small">还没有账号？</span>
                    <a href="/register" class="small text-decoration-none">立即注册</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="/static/jquery-4.0.0.min.js"></script>
<script src="/static/bootstrap-5.3.0-alpha1-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
