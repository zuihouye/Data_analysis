<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>登录 · xx订单平台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth">
  <div class="auth__top">
    <b>xx订单平台</b><span>数据分析 · 客户 / 订单 / 产品管理</span>
  </div>

  <div class="auth__main">
    <div class="auth__side">
      <h1>把每一笔订单，<br>变成可执行的客户分层</h1>
      <p>RFM 客户价值分析、订单与商品管理、历史数据导入——内部员工与客户共用一套账号体系。</p>
      <ul class="auth__points">
        <li><i></i>RFM 八分群：三分位打分，口径与后端计算完全一致</li>
        <li><i></i>回看窗口 3 / 6 / 12 个月与全部历史，支持环比</li>
        <li><i></i>客户 / 员工 / 管理员三种角色，权限由服务端校验</li>
      </ul>
    </div>

    <div class="auth__card">
      <h2>账号登录</h2>
      <p class="sub">使用注册手机号登录，员工账号由管理员创建</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="formfield">
          <label for="mobile">手机号</label>
          <input class="input" type="text" id="mobile" name="mobile"
                 placeholder="请输入 11 位手机号" autocomplete="username"
                 inputmode="numeric" required autofocus>
        </div>
        <div class="formfield">
          <label for="pwd">密码</label>
          <input class="input" type="password" id="pwd" name="pwd"
                 placeholder="请输入密码" autocomplete="current-password" required>
        </div>

        {% if error %}
        <div class="flash flash--error" role="alert">{{ error }}</div>
        {% endif %}

        <button class="btn btn--primary" type="submit">登录</button>
      </form>

      <div class="auth__foot">还没有账号？<a href="{{ url_for('auth.register') }}">注册客户账号</a></div>
    </div>
  </div>
</body>
</html>
