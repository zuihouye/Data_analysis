{% extends 'layout_t.html' %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom pt-3 pb-3">
                <h5 class="mb-0 fw-bold text-dark">修改客户地区</h5>
            </div>
            <div class="card-body">
                <dl class="row text-secondary small mb-4">
                    <dt class="col-sm-4">客户ID</dt>
                    <dd class="col-sm-8">{{ customer.customer_id }}</dd>
                    <dt class="col-sm-4">登录账号</dt>
                    <dd class="col-sm-8">{{ customer.phone or '未注册' }}</dd>
                </dl>
                <form method="post"
                      action="{{ url_for('user.customer_update', customer_id=customer.customer_id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">所在地区</label>
                        <input type="text" class="form-control" name="region" maxlength="64"
                               value="{{ customer.region }}" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark px-4">保存</button>
                        <a href="{{ url_for('user.customer_list') }}" class="btn btn-outline-secondary">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
